<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-primary fw-bold">🪑 Gestión del Salón</h2>
  </div>

  <div class="card shadow-sm mb-5">
    <div class="card-header bg-dark text-white">
      <h5 class="mb-0">Agregar Nueva Mesa</h5>
    </div>
    <div class="card-body">
      <div class="row g-3 align-items-center">
        <div class="col-md-4">
          <input type="number" class="form-control" [(ngModel)]="nuevaMesa.numero" placeholder="Número de Mesa (ej. 1)">
        </div>
        <div class="col-md-4">
          <select class="form-select" [(ngModel)]="nuevaMesa.estado">
            <option value="Libre">Libre</option>
            <option value="Ocupada">Ocupada</option>
          </select>
        </div>
        <div class="col-md-4 d-grid">
          <button class="btn btn-success fw-bold" (click)="guardar()">Guardar Mesa</button>
        </div>
      </div>
    </div>
  </div>

  <div class="row">
    @for (mesa of mesas; track mesa.id) {
    <div class="col-md-3 mb-4">
      <div class="card text-center shadow-sm h-100 border-2"
           [class.border-success]="mesa.estado === 'Libre'"
           [class.border-danger]="mesa.estado === 'Ocupada'">

        <div class="card-body"
             [class.bg-success-subtle]="mesa.estado === 'Libre'"
             [class.bg-danger-subtle]="mesa.estado === 'Ocupada'">

          <h1 class="display-3 fw-bold my-3">{{ mesa.numero }}</h1>

          <span class="badge rounded-pill fs-6"
                [class.text-bg-success]="mesa.estado === 'Libre'"
                [class.text-bg-danger]="mesa.estado === 'Ocupada'">
            {{ mesa.estado }}
          </span>
        </div>
      </div>
    </div>
    } @empty {
    <div class="col-12 text-center text-muted mt-4">
      <p>No hay mesas configuradas todavía. ¡Agregá la Mesa 1 para empezar!</p>
    </div>
    }
  </div>
</div>
