<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-primary fw-bold">🍻 Menú de La Rueda Bar</h2>
  </div>

  <div class="card shadow-sm mb-5">
    <div class="card-header bg-dark text-white">
      <h5 class="mb-0">Agregar Nuevo Producto</h5>
    </div>
    <div class="card-body">
      <div class="row g-3 align-items-center">
        <div class="col-md-4">
          <input type="text" class="form-control" [(ngModel)]="nuevoProducto.nombre" placeholder="Nombre (ej. Cerveza IPA)">
        </div>
        <div class="col-md-3">
          <div class="input-group">
            <span class="input-group-text">$</span>
            <input type="number" class="form-control" [(ngModel)]="nuevoProducto.precio" placeholder="Precio">
          </div>
        </div>
        <div class="col-md-3">
          <input type="text" class="form-control" [(ngModel)]="nuevoProducto.categoria" placeholder="Categoría">
        </div>
        <div class="col-md-2 d-grid">
          <button class="btn btn-success fw-bold" (click)="guardar()">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <div class="table-responsive shadow-sm rounded">
    <table class="table table-hover table-striped mb-0">
      <thead class="table-dark">
        <tr>
          <th scope="col">ID</th>
          <th scope="col">Nombre</th>
          <th scope="col">Precio</th>
          <th scope="col">Categoría</th>
        </tr>
      </thead>
      <tbody>
        @for (prod of productos; track prod.id) {
        <tr>
          <td class="fw-bold">{{ prod.id }}</td>
          <td>{{ prod.nombre }}</td>
          <td class="text-success fw-bold">${{ prod.precio }}</td>
          <td><span class="badge bg-secondary">{{ prod.categoria }}</span></td>
        </tr>
        } @empty {
        <tr>
          <td colspan="4" class="text-center py-4 text-muted">No hay productos en el menú todavía. ¡Agregá el primero!</td>
        </tr>
        }
      </tbody>
    </table>
  </div>
</div>
